<body>
<div class="container">
  <h1>A股量化回测分析<span id="notifBadge" class="badge" style="display:none;">0</span></h1>
  <p class="subtitle">优化策略v2 · 布林下轨 + RSI6&lt;35 + 多因子评分≥80 · 回测胜率81.0%</p>

  <div class="card">
    <div class="input-row">
      <input type="text" id="stockCode" placeholder="输入股票代码，如 600519、000858" maxlength="6">
      <button id="analyzeBtn" onclick="analyze()">开始分析</button>

      <span class="chip" onclick="setCode('002594')">比亚迪 002594</span>

<script>
// ============ 配置 ============
const HOLD_DAYS = 5;
const SCORE_THRESHOLD = 80;
let marketRows = null; // 沪指数据（用于大盘趋势过滤）

// 获取沪指大盘数据
async function loadMarket() {
  if (marketRows) return marketRows;
  try {
    marketRows = await fetchKLine('000001');
  } catch(e) {
    marketRows = [];
  }
  return marketRows;
}

// 判断某日大盘趋势是否向上（沪指收盘价在20日均线上方）
function marketTrendUp(date) {
  if (!marketRows || marketRows.length < 20) return true;
  const idx = marketRows.findIndex(r => r.date <= date);
  // 找到 <= date 的最后一个交易日
  let pos = -1;
  for (let i = 0; i < marketRows.length; i++) {
    if (marketRows[i].date <= date) pos = i; else break;
  }
  if (pos < 20) return true;
  const closes = marketRows.slice(0, pos+1).map(r => r.close);
  const ma20 = MA(closes, 20);
  return closes[pos] > ma20;
}

// ============ 数据获取（新浪财经 JSONP） ============
function fetchKLine(code) {
  return new Promise((resolve, reject) => {
    const prefix = code.startsWith('6') ? 'sh' : 'sz';
    const fullCode = prefix + code;
    const cbName = 'jsonp_cb_' + Date.now() + '_' + Math.floor(Math.random()*1000);
    const script = document.createElement('script');
    let done = false;
    // 新浪返回格式：cbName=([...])  （赋值而非函数调用）
    // 所以 script 加载后 window[cbName] 即为数据数组
    script.onload = () => {
      if (done) return;
      done = true;
      try {
        const data = window[cbName];
        if (!data || !data.length) { reject('无数据'); return; }
        const rows = data.map(item => ({
          date: item.day,
          open: parseFloat(item.open),
          close: parseFloat(item.close),
          high: parseFloat(item.high),
          low: parseFloat(item.low),
          volume: parseFloat(item.volume),
        }));
        resolve(rows);
      } catch(e) { reject(e); }
      finally {
        delete window[cbName];
        script.remove();
      }
    };
    script.onerror = () => {
      if (done) return;
      done = true;
      reject('网络错误');
      script.remove();
      delete window[cbName];
    };
    script.src = `https://quotes.sina.cn/cn/api/jsonp.php/${cbName}=/CN_MarketDataService.getKLineData?symbol=${fullCode}&scale=240&ma=no&datalen=500`;
    document.body.appendChild(script);
    setTimeout(() => {
      if (done) return;
      done = true;
      // 超时后再检查一次（有些浏览器 onload 延迟）
      const data = window[cbName];
      if (data && data.length) {
        try {
          const rows = data.map(item => ({
            date: item.day, open: parseFloat(item.open), close: parseFloat(item.close),
            high: parseFloat(item.high), low: parseFloat(item.low), volume: parseFloat(item.volume),
          }));
          resolve(rows);
        } catch(e) { reject(e); }
      } else {
        reject('请求超时');
      }
      script.remove();
      delete window[cbName];
    }, 15000);
  });
}

// ============ 技术指标计算 ============
function MA(arr, n) {
  if (arr.length < n) return NaN;
  let s = 0;
  for (let i = arr.length - n; i < arr.length; i++) s += arr[i];
  return s / n;
}

function EMA(arr, n) {
  const alpha = 2 / (n + 1);
  let ema = arr[0];
  for (let i = 1; i < arr.length; i++) ema = alpha * arr[i] + (1 - alpha) * ema;
  return ema;
}

function RSI(closes, period) {
  if (closes.length < period + 1) return 50;
  let gains = 0, losses = 0;
  for (let i = closes.length - period; i < closes.length; i++) {
    const d = closes[i] - closes[i-1];
    if (d > 0) gains += d; else losses -= d;
  }
  const avgGain = gains / period;
  const avgLoss = losses / period;
  if (avgLoss === 0) return 100;
  const rs = avgGain / avgLoss;
  return 100 - (100 / (1 + rs));
}

function MACD(closes) {
  let ema12 = closes[0], ema26 = closes[0];
  const difList = [];
  for (const c of closes) {
    ema12 = 2/13 * c + 11/13 * ema12;
    ema26 = 2/27 * c + 25/27 * ema26;
    difList.push(ema12 - ema26);
  }
  const dif = difList[difList.length - 1];
  const dea = EMA(difList, 9);
  const macdHist = 2 * (dif - dea);
  return { dif, dea, macdHist };
}

function KDJ(highs, lows, closes, n=9) {
  if (closes.length < n) return { k: 50, d: 50, j: 50 };
  let lowest = Infinity, highest = -Infinity;
  for (let i = closes.length - n; i < closes.length; i++) {
    if (lows[i] < lowest) lowest = lows[i];
    if (highs[i] > highest) highest = highs[i];
  }
  const rsv = (closes[closes.length-1] - lowest) / (highest - lowest + 1e-8) * 100;
  const k = 2/3 * 50 + 1/3 * rsv;
  const d = 2/3 * 50 + 1/3 * k;
  const j = 3 * k - 2 * d;
  return { k, d, j };
}

function BOLL(closes, n=20, k=2) {
  if (closes.length < n) return { upper: closes[closes.length-1], middle: closes[closes.length-1], lower: closes[closes.length-1] };
  const slice = closes.slice(-n);
  const middle = slice.reduce((a,b)=>a+b,0) / n;
  let variance = 0;
  for (const v of slice) variance += (v - middle) ** 2;
  const std = Math.sqrt(variance / n);
  return { upper: middle + k * std, middle, lower: middle - k * std };
}

// ============ 策略评分函数（与Python版一致） ============
const PARAMS = {
  p_ret5_extreme: 18, p_ret5_strong: 14, p_ret5_mild: 9, p_ret5_weak: 4, p_ret5_ob: 8,
  p_ret3_strong: 6, p_ret3_mild: 3,
  p_rsi_extreme: 18, p_rsi_strong: 18, p_rsi_mild: 9, p_rsi_weak: 4,
  p_rsi_ob: 12, p_rsi_high: 8,
  p_vs_extreme: 12, p_vs_strong: 8, p_vs_mild: 4, p_vr_panic: 6,
  p_cd_5: 8, p_cd_4: 5, p_cd_3: 2,
  p_dist: 6, p_dist_break: 6,
  p_ret10_over: 10, p_ret10_mild: 4,
  p_kdj_extreme: 10, p_kdj_oversold: 6, p_kdj_golden: 5,
  p_macd_pos: 4, p_boll: 6, p_hammer: 8,
  p_long_ls: 5, p_vpd: 4, p_amp_high: 3,
};

function calcScore(row) {
  let score = 50;
  const { ret5, ret3, ret10, rsi6, vr, cd, dist_ma20, vol_shrink,
          kdj_j, kdj_golden, macd_hist, near_boll, hammer,
          long_lower_shadow, vol_price_diverge, amp_ratio } = row;

  if (ret5 <= -15) score += PARAMS.p_ret5_extreme;
  else if (ret5 <= -12) score += PARAMS.p_ret5_strong;
  else if (ret5 <= -10) score += PARAMS.p_ret5_mild;
  else if (ret5 <= -8) score += PARAMS.p_ret5_weak;
  else if (ret5 > 5) score -= PARAMS.p_ret5_ob;

  if (ret3 <= -8) score += PARAMS.p_ret3_strong;
  else if (ret3 <= -5) score += PARAMS.p_ret3_mild;

  if (rsi6 < 20) score += PARAMS.p_rsi_extreme;
  else if (rsi6 < 25) score += PARAMS.p_rsi_strong;
  else if (rsi6 < 30) score += PARAMS.p_rsi_mild;
  else if (rsi6 < 35) score += PARAMS.p_rsi_weak;
  else if (rsi6 > 75) score -= PARAMS.p_rsi_ob;
  else if (rsi6 > 70) score -= PARAMS.p_rsi_high;

  if (vol_shrink < 0.5) score += PARAMS.p_vs_extreme;
  else if (vol_shrink < 0.7) score += PARAMS.p_vs_strong;
  else if (vol_shrink < 0.9) score += PARAMS.p_vs_mild;
  else if (vr > 2.0 && ret5 < 0) score -= PARAMS.p_vr_panic;

  if (cd >= 5) score += PARAMS.p_cd_5;
  else if (cd >= 4) score += PARAMS.p_cd_4;
  else if (cd >= 3) score += PARAMS.p_cd_3;

  if (dist_ma20 > -15 && dist_ma20 < -5) score += PARAMS.p_dist;
  else if (dist_ma20 <= -15) score -= PARAMS.p_dist_break;

  if (ret10 <= -20) score -= PARAMS.p_ret10_over;
  else if (ret10 <= -15) score += PARAMS.p_ret10_mild;

  if (kdj_j < 0) score += PARAMS.p_kdj_extreme;
  else if (kdj_j < 20) score += PARAMS.p_kdj_oversold;
  if (kdj_golden && kdj_j < 50) score += PARAMS.p_kdj_golden;
  if (macd_hist > 0) score += PARAMS.p_macd_pos;
  if (near_boll) score += PARAMS.p_boll;
  if (hammer) score += PARAMS.p_hammer;
  if (long_lower_shadow) score += PARAMS.p_long_ls;
  if (vol_price_diverge) score += PARAMS.p_vpd;
  if (amp_ratio > 1.5) score += PARAMS.p_amp_high;

  return Math.max(0, Math.min(100, score));
}

// ============ 计算某一天的因子 ============
function calcDayFactors(rows, i) {
  const closes = rows.slice(0, i+1).map(r => r.close);
  const highs = rows.slice(0, i+1).map(r => r.high);
  const lows = rows.slice(0, i+1).map(r => r.low);
  const opens = rows.slice(0, i+1).map(r => r.open);
  const volumes = rows.slice(0, i+1).map(r => r.volume);

  const ret5 = (closes[i] / closes[i-5] - 1) * 100;
  const ret3 = (closes[i] / closes[i-3] - 1) * 100;
  const ret10 = (closes[i] / closes[i-10] - 1) * 100;
  const rsi6 = RSI(closes, 6);
  const ma20 = MA(closes, 20);
  const ma60 = MA(closes, 60);
  const boll = BOLL(closes);
  const near_boll = closes[i] < boll.lower * 1.02 ? 1 : 0;
  const vr = volumes[i] / MA(volumes, 5);

  // 连跌天数
  let cd = 0;
  for (let j = i; j > Math.max(i-10, 0); j--) {
    if (closes[j] < closes[j-1]) cd++; else break;
  }
  const dist_ma20 = ma20 > 0 ? (closes[i] / ma20 - 1) * 100 : 0;
  const vol_shrink = volumes[i] / MA(volumes, 20);

  const kdj = KDJ(highs, lows, closes);
  const macd = MACD(closes);

  const body = Math.abs(closes[i] - opens[i]);
  const lower_shadow = Math.min(closes[i], opens[i]) - lows[i];
  const upper_shadow = highs[i] - Math.max(closes[i], opens[i]);
  const hammer = (lower_shadow > 2 * body && upper_shadow < body) ? 1 : 0;
  const long_ls = (lower_shadow > body * 1.5 && body > 0) ? 1 : 0;

  const prevClose = closes[i-1];
  const prevVol = volumes[i-1];
  const vol_price_diverge = (closes[i] < prevClose && volumes[i] < prevVol) ? 1 : 0;

  const amplitude = (highs[i] - lows[i]) / prevClose * 100;
  let ampSum = 0, ampCnt = 0;
  for (let j = Math.max(1, i-20); j < i; j++) {
    ampSum += (highs[j] - lows[j]) / closes[j-1] * 100;
    ampCnt++;
  }
  const amp_ratio = ampCnt > 0 ? amplitude / (ampSum / ampCnt) : 1;

  // 波动率
  const daily_ret = [];
  for (let j = i-20+1; j <= i; j++) daily_ret.push((closes[j] - closes[j-1]) / closes[j-1]);
  const volatility = daily_ret.length > 1 ? Math.sqrt(daily_ret.reduce((s,v)=>s+(v-daily_ret.reduce((a,b)=>a+b,0)/daily_ret.length)**2,0)/daily_ret.length) : 0;

  return {
    ret5, ret3, ret10, rsi6, vr, cd, dist_ma20, vol_shrink,
    kdj_j: kdj.j, kdj_golden: 0, macd_hist: macd.macdHist,
    near_boll, hammer, long_lower_shadow: long_ls,
    vol_price_diverge, amp_ratio, ma20, ma60, boll_lower: boll.lower,
    volatility, close: closes[i], volume: volumes[i],
  };
}

// ============ 主分析流程 ============
let allRows = [];
let codeName = '';

function setCode(c) {
  document.getElementById('stockCode').value = c;
}

async function analyze() {
  const code = document.getElementById('stockCode').value.trim();
  if (!/^\d{6}$/.test(code)) {
    alert('请输入6位股票代码');
    return;
  }
  const btn = document.getElementById('analyzeBtn');
  btn.disabled = true;
  btn.textContent = '分析中...';
  const resultArea = document.getElementById('resultArea');
  resultArea.innerHTML = '<div class="status">正在获取行情数据...</div>';

  try {
    await loadMarket(); // 加载沪指大盘数据
    const rows = await fetchKLine(code);
    allRows = rows;
    codeName = code;
    if (rows.length < 65) {
      resultArea.innerHTML = '<div class="status">数据不足，无法分析</div>';
      return;
    }
    renderResult(rows, code);
  } catch (e) {
    resultArea.innerHTML = `<div class="status">获取数据失败：${e}<br>请检查股票代码或网络连接</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = '开始分析';
  }
}

function renderResult(rows, code) {
  // 最新一天分析
  const lastIdx = rows.length - 1;
  const last = calcDayFactors(rows, lastIdx);
  const score = calcScore(last);

  // 硬条件
  const passBoll = last.near_boll;
  const passRsi = last.rsi6 < 35;
  const passMa60 = !isNaN(last.ma60) && last.close > last.ma60;
  const passVol = last.volatility > 0.02;
  const passMarket = marketTrendUp(rows[lastIdx].date);
  const hardPass = passBoll && passRsi;
  const filterPass = passMa60 && passVol && passMarket;
  const isSignal = hardPass && filterPass && score >= SCORE_THRESHOLD;

  let signalClass, signalText, signalLabel;
  if (isSignal) {
    signalClass = 'signal-buy';
    signalText = '买入信号';
    signalLabel = `评分 ${score.toFixed(0)} ≥ ${SCORE_THRESHOLD}，符合所有条件`;
  } else if (hardPass && filterPass) {
    signalClass = 'signal-hold';
    signalText = '观望（评分不足）';
    signalLabel = `评分 ${score.toFixed(0)} < ${SCORE_THRESHOLD}，硬条件已满足`;
  } else {
    signalClass = 'signal-nothing';
    signalText = '无信号';
    signalLabel = `未满足硬条件（布林下轨+RSI<35）`;
  }

  // 历史回测信号
  const signals = [];
  for (let i = 65; i < rows.length - HOLD_DAYS; i++) {
    if (!marketTrendUp(rows[i].date)) continue; // 大盘趋势过滤
    const f = calcDayFactors(rows, i);
    const s = calcScore(f);
    const hb = f.near_boll && f.rsi6 < 35;
    const fp = (!isNaN(f.ma60) && f.close > f.ma60) && f.volatility > 0.02;
    if (hb && fp && s >= SCORE_THRESHOLD) {
      const buy = rows[i].close;
      const sell = rows[i + HOLD_DAYS].close;
      const ret = (sell / buy - 1) * 100;
      let maxGain = -Infinity, maxLoss = Infinity;
      for (let k = i+1; k <= i+HOLD_DAYS; k++) {
        maxGain = Math.max(maxGain, (rows[k].high / buy - 1) * 100);
        maxLoss = Math.min(maxLoss, (rows[k].low / buy - 1) * 100);
      }
      signals.push({ date: rows[i].date, buy, sell, ret, maxGain, maxLoss, score: s, win: ret > 0 });
    }
  }

  const winRate = signals.length > 0 ? (signals.filter(s => s.win).length / signals.length * 100) : 0;
  const avgRet = signals.length > 0 ? signals.reduce((a,s)=>a+s.ret,0) / signals.length : 0;

  // 条件检查项
  const checks = [
    { label: '触及布林下轨', pass: passBoll, detail: `收盘价 ${last.close.toFixed(2)} vs 下轨 ${last.boll_lower.toFixed(2)}` },
    { label: 'RSI6 < 35', pass: passRsi, detail: `RSI6 = ${last.rsi6.toFixed(1)}` },
    { label: '价格在MA60上方', pass: passMa60, detail: `MA60 = ${isNaN(last.ma60)?'N/A':last.ma60.toFixed(2)}` },
    { label: '20日波动率 > 2%', pass: passVol, detail: `波动率 = ${(last.volatility*100).toFixed(2)}%` },
    { label: '大盘趋势向上', pass: passMarket, detail: passMarket ? '沪指在MA20上方' : '沪指在MA20下方' },
    { label: `评分 ≥ ${SCORE_THRESHOLD}`, pass: score >= SCORE_THRESHOLD, detail: `评分 = ${score.toFixed(1)}` },
  ];

  let html = '';
  html += `<div class="signal-big ${signalClass}">
    <div class="signal-label">${code} · ${rows[lastIdx].date}</div>
    <div class="signal-action">${signalText}</div>
    <div class="signal-score">${signalLabel}</div>
  </div>`;

  html += '<div class="card"><h3 style="margin-bottom:12px;font-size:15px;">当前因子状态</h3><div class="grid">';
  const metrics = [
    { label: '收盘价', value: last.close.toFixed(2), cls: 'up' },
    { label: '5日涨跌幅', value: last.ret5.toFixed(2)+'%', cls: last.ret5>=0?'up':'down' },
    { label: 'RSI6', value: last.rsi6.toFixed(1), cls: last.rsi6<30?'down':(last.rsi6>70?'up':'') },
    { label: 'KDJ-J', value: last.kdj_j.toFixed(1), cls: last.kdj_j<0?'down':'' },
    { label: 'MACD柱', value: last.macd_hist.toFixed(3), cls: last.macd_hist>0?'up':'down' },
    { label: '量比', value: last.vr.toFixed(2), cls: '' },
    { label: '连跌天数', value: last.cd, cls: last.cd>=3?'down':'' },
    { label: '距MA20', value: last.dist_ma20.toFixed(1)+'%', cls: last.dist_ma20<0?'down':'up' },
    { label: '缩量比', value: last.vol_shrink.toFixed(2), cls: last.vol_shrink<0.7?'down':'' },
    { label: '振幅比', value: last.amp_ratio.toFixed(2), cls: last.amp_ratio>1.5?'up':'' },
  ];
  for (const m of metrics) {
    html += `<div class="metric"><div class="metric-label">${m.label}</div><div class="metric-value ${m.cls}">${m.value}</div></div>`;
  }
  html += '</div></div>';

  html += '<div class="card"><h3 style="margin-bottom:12px;font-size:15px;">信号条件检查</h3>';
  for (const c of checks) {
    html += `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #2a3142;">
      <span>${c.pass ? '<span class="win-dot">✓</span>' : '<span class="lose-dot">✗</span>'} ${c.label}</span>
      <span style="color:#888;font-size:12px;">${c.detail}</span>
    </div>`;
  }
  html += '</div>';

  html += '<div class="card"><h3 style="margin-bottom:12px;font-size:15px;">历史回测信号（持有5天）</h3>';
  html += `<div class="grid" style="margin-bottom:16px;">
    <div class="metric"><div class="metric-label">总信号数</div><div class="metric-value">${signals.length}</div></div>
    <div class="metric"><div class="metric-label">胜率</div><div class="metric-value ${winRate>=70?'up':(winRate>=50?'':'down')}">${winRate.toFixed(1)}%</div></div>
    <div class="metric"><div class="metric-label">平均收益</div><div class="metric-value ${avgRet>=0?'up':'down'}">${avgRet>=0?'+':''}${avgRet.toFixed(2)}%</div></div>
    <div class="metric"><div class="metric-label">盈利/亏损</div><div class="metric-value"><span class="up">${signals.filter(s=>s.win).length}</span> / <span class="down">${signals.filter(s=>!s.win).length}</span></div></div>
  </div>`;

  if (signals.length > 0) {
    html += '<table><thead><tr><th>日期</th><th>买入价</th><th>评分</th><th>5日收益</th><th>最大涨幅</th><th>最大跌幅</th><th>结果</th></tr></thead><tbody>';
    for (const s of signals.slice().reverse()) {
      html += `<tr>
        <td>${s.date}</td>
        <td>${s.buy.toFixed(2)}</td>
        <td>${s.score.toFixed(0)}</td>
        <td class="${s.ret>=0?'up':'down'}">${s.ret>=0?'+':''}${s.ret.toFixed(2)}%</td>
        <td class="up">+${s.maxGain.toFixed(2)}%</td>
        <td class="down">${s.maxLoss.toFixed(2)}%</td>
        <td>${s.win ? '<span class="tag tag-bull">盈利</span>' : '<span class="tag tag-bear">亏损</span>'}</td>
      </tr>`;
    }
    html += '</tbody></table>';
  } else {
    html += '<div class="status">该股票近500天无符合策略的信号</div>';
  }
  html += '</div>';

  // K线图
  html += '<div class="card"><h3 style="margin-bottom:12px;font-size:15px;">近120日K线与策略信号</h3>';
  html += '<div class="chart-wrap"><canvas id="priceChart"></canvas></div>';
  html += '<div class="legend"><span class="lg-price">收盘价</span><span class="lg-ma20">MA20</span><span class="lg-boll">布林带</span></div>';
  html += '</div>';

  document.getElementById('resultArea').innerHTML = html;
  drawChart(rows, signals);
}

// ============ K线图绘制 ============
function drawChart(rows, signals) {
  const canvas = document.getElementById('priceChart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);
  const W = rect.width, H = rect.height;

  const startIdx = Math.max(65, rows.length - 120);
  const viewRows = rows.slice(startIdx);
  const viewSignals = signals.filter(s => {
    const idx = rows.findIndex(r => r.date === s.date);
    return idx >= startIdx;
  });

  let minP = Infinity, maxP = -Infinity;
  for (const r of viewRows) {
    const boll = BOLL(rows.slice(0, rows.indexOf(r)+1).map(x=>x.close));
    minP = Math.min(minP, r.low, boll.lower);
    maxP = Math.max(maxP, r.high, boll.upper);
  }
  const padL = 50, padR = 10, padT = 10, padB = 25;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const xStep = plotW / viewRows.length;
  const y = p => padT + (maxP - p) / (maxP - minP) * plotH;

  // 网格
  ctx.strokeStyle = '#2a3142';
  ctx.lineWidth = 1;
  ctx.fillStyle = '#888';
  ctx.font = '10px sans-serif';
  for (let i = 0; i <= 4; i++) {
    const yy = padT + plotH * i / 4;
    ctx.beginPath(); ctx.moveTo(padL, yy); ctx.lineTo(W-padR, yy); ctx.stroke();
    const price = maxP - (maxP-minP) * i / 4;
    ctx.fillText(price.toFixed(2), 5, yy+3);
  }

  // 布林带
  ctx.strokeStyle = 'rgba(100,100,100,.5)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 0; i < viewRows.length; i++) {
    const boll = BOLL(rows.slice(0, startIdx+i+1).map(x=>x.close));
    const xx = padL + i * xStep;
    if (i === 0) ctx.moveTo(xx, y(boll.upper)); else ctx.lineTo(xx, y(boll.upper));
  }
  ctx.stroke();
  ctx.beginPath();
  for (let i = 0; i < viewRows.length; i++) {
    const boll = BOLL(rows.slice(0, startIdx+i+1).map(x=>x.close));
    const xx = padL + i * xStep;
    if (i === 0) ctx.moveTo(xx, y(boll.lower)); else ctx.lineTo(xx, y(boll.lower));
  }
  ctx.stroke();

  // MA20
  ctx.strokeStyle = '#ffa500';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let i = 0; i < viewRows.length; i++) {
    const ma = MA(rows.slice(0, startIdx+i+1).map(x=>x.close), 20);
    if (isNaN(ma)) continue;
    const xx = padL + i * xStep;
    if (ctx.isPointInPath && i === 0) ctx.moveTo(xx, y(ma)); else ctx.lineTo(xx, y(ma));
  }
  ctx.stroke();

  // 收盘价线
  ctx.strokeStyle = '#4a9eff';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let i = 0; i < viewRows.length; i++) {
    const xx = padL + i * xStep;
    if (i === 0) ctx.moveTo(xx, y(viewRows[i].close)); else ctx.lineTo(xx, y(viewRows[i].close));
  }
  ctx.stroke();

  // 信号标记
  for (const s of viewSignals) {
    const idx = rows.findIndex(r => r.date === s.date) - startIdx;
    if (idx < 0) continue;
    const xx = padL + idx * xStep;
    const yy = y(viewRows[idx].close);
    ctx.fillStyle = s.win ? '#00d4aa' : '#ff4d4f';
    ctx.beginPath();
    ctx.moveTo(xx, yy - 10);
    ctx.lineTo(xx - 5, yy - 3);
    ctx.lineTo(xx + 5, yy - 3);
    ctx.closePath();
    ctx.fill();
  }
}

// ============ 全市场扫描 ============
let scanRunning = false;
let scanCancelled = false;
let scanResults = [];

// 新浪 getHQNodeData 获取一页股票（支持 CORS，需 GBK 解码）
async function fetchSinaStockPage(page) {
  const url = 'https://vip.stock.finance.sina.com.cn/quotes_service/api/json_v2.php/Market_Center.getHQNodeData';
  const params = new URLSearchParams({
    page: page, num: 100, sort: 'symbol', asc: 1,
    node: 'hs_a', symbol: '', _s_r_a: 'auto',
  });
  const resp = await fetch(url + '?' + params.toString());
  const buffer = await resp.arrayBuffer();
  const text = new TextDecoder('gbk').decode(buffer);
  return JSON.parse(text);
}

// 获取全市场股票列表（含实时价格）—— 分页拉取新浪数据
async function fetchStockList(onProgress) {
  const allStocks = [];
  let page = 1;
  while (true) {
    if (scanCancelled) break;
    let data;
    try {
      data = await fetchSinaStockPage(page);
    } catch(e) {
      break;
    }
    if (!data || data.length === 0) break;
    for (const item of data) {
      const price = parseFloat(item.trade);
      if (price > 0 && item.code && item.code.match(/^[036]/)) {
        allStocks.push({
          code: item.code,
          name: item.name,
          price,
          change: parseFloat(item.changepercent) || 0,
          prevClose: parseFloat(item.settlement) || price,
          open: parseFloat(item.open),
          high: parseFloat(item.high),
          low: parseFloat(item.low),
          volume: parseFloat(item.volume) || 0,
        });
      }
    }
    if (onProgress) onProgress(page * 100, page * 100, allStocks.length);
    if (data.length < 100) break;
    page++;
    await new Promise(r => setTimeout(r, 150));
  }
  return allStocks;
}

// 检查单只股票是否符合策略
async function checkStock(code, name, price, threshold) {
  try {
    const rows = await fetchKLine(code);
    if (rows.length < 65) return null;
    const last = calcDayFactors(rows, rows.length - 1);
    const score = calcScore(last);
    const hb = last.near_boll && last.rsi6 < 35;
    const fp = (!isNaN(last.ma60) && last.close > last.ma60) && last.volatility > 0.02;
    const mp = marketTrendUp(rows[rows.length-1].date);
    const match = hb && fp && mp && score >= threshold;
    return {
      code, name, price, score, match,
      rsi6: last.rsi6, ret5: last.ret5, nearBoll: last.near_boll,
      change: ((price / rows[rows.length-2].close - 1) * 100),
    };
  } catch(e) {
    return null;
  }
}

async function startScan() {
  if (scanRunning) return;
  scanRunning = true;
  scanCancelled = false;
  scanResults = [];
  document.getElementById('scanBtn').style.display = 'none';
  document.getElementById('stopScanBtn').style.display = 'inline-block';
  const status = document.getElementById('scanStatus');
  const progress = document.getElementById('scanProgress');
  const resultsDiv = document.getElementById('scanResults');
  resultsDiv.innerHTML = '';

  const pMin = parseFloat(document.getElementById('priceMin').value) || 10;
  const pMax = parseFloat(document.getElementById('priceMax').value) || 30;
  const threshold = parseInt(document.getElementById('scanThreshold').value) || 80;

  status.textContent = '正在获取全市场实时行情...';
  let stocks;
  try {
    stocks = await fetchStockList((cur, total, valid) => {
      if (scanCancelled) return;
      const pct = Math.round(cur / total * 50); // 行情阶段占50%进度
      progress.style.width = pct + '%';
      status.textContent = `正在获取实时行情... ${cur}/${total}（已获取 ${valid} 只有效股票）`;
    });
  } catch(e) {
    status.textContent = '获取股票列表失败：' + e;
    scanRunning = false;
    document.getElementById('scanBtn').style.display = 'inline-block';
    document.getElementById('stopScanBtn').style.display = 'none';
    return;
  }

  if (scanCancelled) {
    scanRunning = false;
    document.getElementById('scanBtn').style.display = 'inline-block';
    document.getElementById('stopScanBtn').style.display = 'none';
    status.textContent = '扫描已停止';
    return;
  }

  // 价格过滤
  const filtered = stocks.filter(s => s.price >= pMin && s.price <= pMax);
  status.textContent = `全市场 ${stocks.length} 只，价格 ${pMin}-${pMax} 元共 ${filtered.length} 只，开始策略匹配...`;

  // 确保大盘数据已加载
  await loadMarket();

  const batchSize = 25;
  let done = 0;
  let matches = [];
  let allScored = []; // 所有有效评分结果（用于备选推荐）

  for (let i = 0; i < filtered.length; i += batchSize) {
    if (scanCancelled) break;
    const batch = filtered.slice(i, i + batchSize);
    const promises = batch.map(s => checkStock(s.code, s.name, s.price, threshold));
    const results = await Promise.all(promises);
    for (const r of results) {
      if (r) {
        if (r.match) matches.push(r);
        allScored.push(r);
      }
    }
    done += batch.length;
    const pct = Math.min(100, 50 + Math.round(done / filtered.length * 50));
    progress.style.width = pct + '%';
    status.textContent = `策略匹配中 ${done}/${filtered.length}，已发现 ${matches.length} 只符合策略`;
    // 渲染当前结果
    renderScanResults(matches, allScored);
  }

  scanRunning = false;
  document.getElementById('scanBtn').style.display = 'inline-block';
  document.getElementById('stopScanBtn').style.display = 'none';
  if (scanCancelled) {
    status.textContent = `扫描已停止，共扫描 ${done} 只，发现 ${matches.length} 只符合策略`;
  } else {
    status.textContent = `扫描完成！共扫描 ${filtered.length} 只，发现 ${matches.length} 只符合策略（价格${pMin}-${pMax}元，评分≥${threshold}）`;
    if (matches.length > 0 && 'Notification' in window && Notification.permission === 'granted') {
      new Notification('量化策略筛选完成', {
        body: `发现 ${matches.length} 只符合策略的股票（${pMin}-${pMax}元）`,
      });
    }
  }
  scanResults = matches;
  renderScanResults(matches, allScored);
}

function stopScan() {
  scanCancelled = true;
}

function renderScanResults(matches, allScored) {
  const div = document.getElementById('scanResults');
  let html = '';

  // 强烈推荐（完全符合策略）
  if (matches.length > 0) {
    const sorted = matches.slice().sort((a,b) => b.score - a.score);
    html += '<h3 style="color:#00d4aa;margin:16px 0 8px;">🎯 强烈推荐（完全符合策略）</h3>';
    html += '<table><thead><tr><th>代码</th><th>名称</th><th>现价</th><th>涨跌幅</th><th>评分</th><th>RSI6</th><th>5日涨跌</th><th>操作</th></tr></thead><tbody>';
    for (const m of sorted) {
      html += `<tr class="result-row" onclick="setCode('${m.code}');analyze();">
        <td>${m.code}</td>
        <td>${m.name}</td>
        <td>${m.price.toFixed(2)}</td>
        <td class="${m.change>=0?'up':'down'}">${m.change>=0?'+':''}${m.change.toFixed(2)}%</td>
        <td style="color:#00d4aa;font-weight:bold;">${m.score.toFixed(0)}</td>
        <td>${m.rsi6.toFixed(1)}</td>
        <td class="${m.ret5>=0?'up':'down'}">${m.ret5>=0?'+':''}${m.ret5.toFixed(1)}%</td>
        <td><span class="tag tag-bull">点击分析</span></td>
      </tr>`;
    }
    html += '</tbody></table>';
  }

  // 备选推荐（评分最高的前10只，即使未完全符合策略）
  if (allScored && allScored.length > 0) {
    const top = allScored.filter(r => !r.match).slice().sort((a,b) => b.score - a.score).slice(0, 10);
    if (top.length > 0) {
      html += '<h3 style="color:#ffb300;margin:16px 0 8px;">⭐ 备选推荐（评分前10）</h3>';
      html += '<table><thead><tr><th>代码</th><th>名称</th><th>现价</th><th>涨跌幅</th><th>评分</th><th>RSI6</th><th>5日涨跌</th><th>布林下轨</th><th>操作</th></tr></thead><tbody>';
      for (const m of top) {
        html += `<tr class="result-row" onclick="setCode('${m.code}');analyze();">
          <td>${m.code}</td>
          <td>${m.name}</td>
          <td>${m.price.toFixed(2)}</td>
          <td class="${m.change>=0?'up':'down'}">${m.change>=0?'+':''}${m.change.toFixed(2)}%</td>
          <td style="color:#ffb300;font-weight:bold;">${m.score.toFixed(0)}</td>
          <td>${m.rsi6.toFixed(1)}</td>
          <td class="${m.ret5>=0?'up':'down'}">${m.ret5>=0?'+':''}${m.ret5.toFixed(1)}%</td>
          <td>${m.nearBoll?'是':'否'}</td>
          <td><span class="tag tag-bull">点击分析</span></td>
        </tr>`;
      }
      html += '</tbody></table>';
    }
  }

  if (html === '') {
    div.innerHTML = '<div class="status">暂无符合策略的股票，可尝试降低评分阈值</div>';
  } else {
    div.innerHTML = html;
  }
}

// ============ 实时监控 ============
let monitorRunning = false;
let monitorTimer = null;
let notifiedStocks = new Set(); // 今日已通知的股票，避免重复推送

function isTradingHours() {
  const now = new Date();
  const day = now.getDay();
  if (day === 0 || day === 6) return false; // 周末
  const h = now.getHours(), m = now.getMinutes();
  const t = h * 60 + m;
  return (t >= 9*60+30 && t <= 11*60+30) || (t >= 13*60 && t <= 15*60);
}

async function toggleMonitor() {
  const btn = document.getElementById('monitorBtn');
  if (monitorRunning) {
    monitorRunning = false;
    if (monitorTimer) { clearInterval(monitorTimer); monitorTimer = null; }
    btn.textContent = '开启实时监控';
    btn.classList.remove('monitor-on', 'pulse');
    return;
  }

  // 请求通知权限
  if ('Notification' in window && Notification.permission === 'default') {
    await Notification.requestPermission();
  }

  monitorRunning = true;
  btn.textContent = '● 实时监控中';
  btn.classList.add('monitor-on', 'pulse');
  notifiedStocks.clear();

  // 立即执行一次
  runMonitorScan();
  // 每60秒检查一次
  monitorTimer = setInterval(runMonitorScan, 60000);
}

async function runMonitorScan() {
  if (!monitorRunning) return;
  const status = document.getElementById('scanStatus');
  const pMin = parseFloat(document.getElementById('priceMin').value) || 10;
  const pMax = parseFloat(document.getElementById('priceMax').value) || 30;
  const threshold = parseInt(document.getElementById('scanThreshold').value) || 80;
  const now = new Date().toLocaleTimeString('zh-CN');

  if (!isTradingHours()) {
    status.textContent = `[${now}] 非交易时段，监控暂停（交易时间：9:30-11:30, 13:00-15:00）`;
    return;
  }

  status.textContent = `[${now}] 实时监控中：正在扫描价格 ${pMin}-${pMax} 元的股票...`;
  try {
    await loadMarket();
    const stocks = await fetchStockList();
    const filtered = stocks.filter(s => s.price >= pMin && s.price <= pMax);
    // 实时监控只快速检查：价格在区间 + 当日跌幅较大（可能超跌）的股票
    const candidates = filtered.filter(s => s.change < 0).slice(0, 200);

    let newSignals = [];
    const batchSize = 25;
    for (let i = 0; i < candidates.length; i += batchSize) {
      if (!monitorRunning) break;
      const batch = candidates.slice(i, i + batchSize);
      const promises = batch.map(s => checkStock(s.code, s.name, s.price, threshold));
      const results = await Promise.all(promises);
      for (const r of results) {
        if (r && r.match && !notifiedStocks.has(r.code)) {
          newSignals.push(r);
          notifiedStocks.add(r.code);
        }
      }
    }

    if (newSignals.length > 0) {
      status.textContent = `[${now}] 发现 ${newSignals.length} 只新信号！`;
      scanResults = [...scanResults, ...newSignals];
      renderScanResults(scanResults);
      // 更新通知徽标
      const badge = document.getElementById('notifBadge');
      const cnt = scanResults.length;
      badge.textContent = cnt;
      badge.style.display = 'inline';
      // 浏览器推送
      if ('Notification' in window && Notification.permission === 'granted') {
        for (const s of newSignals.slice(0, 3)) {
          new Notification(`策略信号：${s.name}(${s.code})`, {
            body: `现价 ${s.price.toFixed(2)}元，评分 ${s.score.toFixed(0)}，点击查看详情`,
          });
        }
      }
    } else {
      status.textContent = `[${now}] 监控中，暂无新信号（已扫描 ${candidates.length} 只候选）`;
    }
  } catch(e) {
    status.textContent = `[${now}] 监控出错：${e}`;
  }
}

// ============ 页面加载自动扫描 ============
window.addEventListener('load', () => {
  // 请求通知权限（用于实时推送）
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
  // 延迟2秒后自动执行全市场扫描
  setTimeout(() => {
    if (!scanRunning) startScan();
    // 若在交易时段，自动开启实时监控
    if (isTradingHours()) toggleMonitor();
  }, 2000);
});
</script>
